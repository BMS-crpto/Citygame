<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>City Life Online</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#cfa98a;font-family:system-ui,sans-serif;color:#fff}
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(#1b2a5e,#c0526a 90%,#f2b27a);z-index:10;padding:16px;overflow:auto}
  #menu h1{margin:0;font-size:28px;text-shadow:0 3px 10px #0007}
  input{padding:12px;border-radius:12px;border:0;font-size:16px;width:250px;text-align:center}
  .roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:350px}
  .role{padding:10px 6px;border-radius:14px;background:#ffffff25;text-align:center;font-size:13px;border:2px solid transparent}
  .role b{display:block;font-size:26px}
  .role small{display:block;font-size:10px;opacity:.85}
  .role.sel{border-color:#ffd54a;background:#ffffff50}
  button{padding:14px 30px;font-size:18px;border:0;border-radius:14px;background:#ffd54a;font-weight:700;color:#222}
  #hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;font-size:13px;z-index:5}
  #hud div{background:#000a;padding:6px 10px;border-radius:12px;backdrop-filter:blur(4px)}
  #money{color:#7CFC8A;font-weight:800;font-size:16px}
  #toast{position:fixed;top:84px;left:50%;transform:translateX(-50%);background:#000b;padding:8px 14px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;z-index:6;max-width:90%;text-align:center;pointer-events:none}
  #jailmsg{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);background:#000c;padding:14px 20px;border-radius:16px;font-size:20px;display:none;z-index:6;text-align:center}
  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:4;transition:opacity .5s}
  .pop{position:fixed;top:44px;right:16px;font-size:26px;font-weight:900;z-index:7;pointer-events:none;text-shadow:0 2px 8px #000;animation:pop 1.4s ease-out forwards}
  @keyframes pop{from{transform:translateY(0);opacity:1}to{transform:translateY(-50px);opacity:0}}
  #stick{position:fixed;left:22px;bottom:30px;width:124px;height:124px;border-radius:50%;background:#ffffff30;border:2px solid #ffffff40;z-index:5}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#ffffffb0}
  #act{position:fixed;right:22px;bottom:34px;width:92px;height:92px;border-radius:50%;background:#e53935;font-size:14px;font-weight:800;border:3px solid #ffffff60;color:#fff;z-index:5;padding:0}
  #use{position:fixed;right:22px;bottom:140px;min-width:96px;height:54px;border-radius:27px;background:#43a047;font-size:14px;font-weight:800;border:3px solid #ffffff60;color:#fff;z-index:5;padding:0 14px;display:none}
  .sbtn{position:fixed;width:46px;height:46px;border-radius:50%;background:#000a;font-size:20px;padding:0;color:#fff;z-index:5;border:2px solid #ffffff40}
  #chatbtn{right:22px;bottom:204px;background:#1e88e5}
  #fsbtn{right:76px;top:max(46px,calc(env(safe-area-inset-top) + 38px))}
  #mutebtn{right:130px;top:max(46px,calc(env(safe-area-inset-top) + 38px))}
  #district{position:fixed;top:max(46px,calc(env(safe-area-inset-top) + 38px));left:8px;background:#000a;padding:4px 12px;border-radius:12px;font-size:12px;z-index:5;pointer-events:none}
  #banner{position:fixed;top:26%;left:50%;transform:translateX(-50%);font-size:30px;font-weight:900;text-shadow:0 3px 14px #000;opacity:0;pointer-events:none;z-index:7;white-space:nowrap}
  .bshow{animation:bshow 2.8s ease-out}
  @keyframes bshow{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0}}
  .qrow{display:flex;gap:8px}
  .q{padding:8px 16px;font-size:14px;border-radius:12px;background:#ffffff25;color:#fff;border:2px solid transparent}
  .q.sel{border-color:#ffd54a;background:#ffffff50}
  #speedo{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000a;padding:6px 16px;border-radius:14px;font-size:26px;font-weight:900;display:none;z-index:5;letter-spacing:1px}
  #speedo small{font-size:11px;opacity:.7;margin-left:4px}
  #mm{position:fixed;right:8px;top:max(86px,calc(env(safe-area-inset-top) + 78px));width:110px;height:110px;border-radius:50%;border:2px solid #ffffff60;background:#000a;z-index:5;pointer-events:none}
  #board{position:fixed;left:8px;top:max(120px,calc(env(safe-area-inset-top) + 112px));font-size:11px;background:#0008;padding:4px 8px;border-radius:10px;z-index:5;pointer-events:none;line-height:1.5}
  #board b{color:#7CFC8A}
  #needs{position:fixed;left:8px;top:max(76px,calc(env(safe-area-inset-top) + 68px));z-index:5;pointer-events:none;background:#0008;padding:4px 7px;border-radius:10px;font-size:11px}
  .nd{display:flex;align-items:center;gap:5px;height:15px}
  .nd i{display:block;width:56px;height:6px;border-radius:3px;background:#ffffff30;overflow:hidden}
  .nd i b{display:block;height:100%;border-radius:3px}
  #busy{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);min-width:200px;background:#000b;border-radius:14px;padding:6px 14px;font-size:13px;font-weight:700;display:none;z-index:6;text-align:center}
  #busy i{display:block;height:7px;border-radius:4px;background:#ffffff30;margin-top:5px;overflow:hidden}
  #busy i b{display:block;height:100%;width:0;background:#ffd54a}
  .ov{position:fixed;inset:0;background:#000a;z-index:9;display:none;align-items:center;justify-content:center;padding:14px}
  .ov,.ov *{touch-action:pan-y}
  .ov .card{background:#1c2438;border-radius:18px;padding:14px;width:100%;max-width:380px;max-height:84vh;overflow:auto;-webkit-overflow-scrolling:touch}
  .ov h3{margin:0 0 8px;font-size:17px}
  .ob{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;margin:5px 0;padding:11px 12px;border-radius:12px;background:#ffffff1c;color:#fff;font-size:14px;font-weight:600;text-align:left;border:0}
  .ob small{display:block;font-weight:400;opacity:.7;font-size:11px}
  .ob em{font-style:normal;color:#7CFC8A;white-space:nowrap}
  .ob:disabled{opacity:.4}
  .ob.x{justify-content:center;background:#ffffff33}
  .tabs{display:flex;gap:6px;margin-bottom:8px}
  .tabs button{flex:1;padding:8px 4px;font-size:13px;border-radius:10px;background:#ffffff1c;color:#fff}
  .tabs button.sel{background:#ffd54a;color:#222}
  .bar{height:10px;border-radius:5px;background:#ffffff25;overflow:hidden;margin:3px 0 9px}
  .bar b{display:block;height:100%}
  .pp{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 0;border-bottom:1px solid #ffffff15;font-size:13px}
  .pp button{padding:5px 8px;font-size:11px;border-radius:8px;margin-left:3px;background:#43a047;color:#fff}
  #phonebtn{right:184px;top:max(46px,calc(env(safe-area-inset-top) + 38px))}
  #chatlog{position:fixed;left:8px;top:150px;font-size:12px;max-width:55%;z-index:5;pointer-events:none}
  #chatlog div{background:#0008;padding:3px 8px;border-radius:8px;margin-bottom:3px}
  @media (orientation:landscape){
    #menu{flex-direction:row;flex-wrap:wrap;gap:10px 24px}
    #menu h1{width:100%;text-align:center;font-size:22px}
    .roles{grid-template-columns:repeat(5,1fr);max-width:560px}
    .role{padding:6px 4px}.role b{font-size:20px}
    #stick{left:max(30px,env(safe-area-inset-left));bottom:18px;width:112px;height:112px}
    #act{right:max(30px,env(safe-area-inset-right));bottom:20px;width:84px;height:84px}
    #use{right:max(130px,calc(env(safe-area-inset-right) + 110px));bottom:24px}
    #chatbtn{right:max(30px,env(safe-area-inset-right));bottom:116px}
    #speedo{bottom:12px;font-size:22px}
    #chatlog{top:150px}
    #mm{top:50px;width:90px;height:90px}
    #board{top:50px;left:auto;right:108px}
  }
</style>
</head>
<body>
<div id="menu">
  <h1>🏙️ City Life Online</h1>
  <div style="display:flex;flex-direction:column;gap:10px;align-items:center">
    <input id="name" placeholder="Your name" maxlength="14">
    <input id="room" placeholder="Room code (share with friends)" maxlength="8" style="text-transform:uppercase">
  </div>
  <div style="display:flex;flex-direction:column;gap:10px;align-items:center">
    <div>Choose your role</div>
    <div class="roles" id="roles"></div>
    <div style="font-size:12px;opacity:.85">Graphics</div>
    <div class="qrow" id="qrow"><button class="q" data-q="low">Low</button><button class="q sel" data-q="med">Medium</button><button class="q" data-q="high">High</button></div>
    <button id="play">PLAY ▶</button>
  </div>
</div>
<div id="flash"></div>
<div id="hud"><div id="info"></div><div id="money">₦20,000</div><div id="players"></div></div>
<div id="district"></div><div id="banner"></div>
<div id="needs"></div>
<div id="busy"><span id="busyl"></span><i><b id="busyf"></b></i></div>
<div class="ov" id="spotov"><div class="card"><h3 id="smt"></h3><div id="smo"></div><button class="ob x" id="smx">Close</button></div></div>
<div class="ov" id="phoneov"><div class="card"><div class="tabs" id="ptabs"><button data-t="me" class="sel">🧍 Me</button><button data-t="bag">🎒 Bag</button><button data-t="ppl">👥 People</button></div><div id="pc"></div><button class="ob x" id="phx">Close</button></div></div>
<div id="toast"></div>
<div id="jailmsg">⛓️ You are in JAIL<br><small>Wait, or a lawyer can free you</small></div>
<canvas id="mm" width="220" height="220"></canvas><div id="board" style="display:none"></div>
<div id="chatlog"></div>
<div id="speedo"><span id="spd">0</span><small>KM/H</small></div>
<div id="stick"><div id="knob"></div></div>
<button id="act">ACTION</button>
<button id="use"></button>
<button id="chatbtn" class="sbtn">💬</button>
<button id="fsbtn" class="sbtn">⛶</button>
<button id="phonebtn" class="sbtn">📱</button>
<button id="mutebtn" class="sbtn">🔊</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const ROLES = {
  police:{emoji:'🚔',label:'Police',desc:'Arrest thieves'},
  thief:{emoji:'🦹',label:'Thief',desc:'Rob shops'},
  nurse:{emoji:'💉',label:'Nurse',desc:'Heal people'},
  lawyer:{emoji:'⚖️',label:'Lawyer',desc:'Free from jail'},
  taxi:{emoji:'🚕',label:'Taxi',desc:'Pick up riders'}
};
let myRole='police',myName='Player';
const rolesEl=document.getElementById('roles');
Object.entries(ROLES).forEach(([k,r])=>{
  const d=document.createElement('div');d.className='role'+(k===myRole?' sel':'');
  d.innerHTML=`<b>${r.emoji}</b>${r.label}<small>${r.desc}</small>`;
  d.onclick=()=>{myRole=k;[...rolesEl.children].forEach(c=>c.classList.remove('sel'));d.classList.add('sel')};
  rolesEl.appendChild(d);
});

// =============== renderer, sky, light ===============
const HORIZON=0xf2cfae;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(HORIZON,70,210);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.1,320);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});

const SUNDIR=new THREE.Vector3(-0.5,0.55,0.65).normalize();
const skyGroup=new THREE.Group();scene.add(skyGroup);
const skyMat=new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,
  uniforms:{top:{value:new THREE.Color(0x2f6fd0)},mid:{value:new THREE.Color(0x9cc4ee)},hor:{value:new THREE.Color(HORIZON)}},
  vertexShader:'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform vec3 top;uniform vec3 mid;uniform vec3 hor;varying float h;void main(){vec3 c=mix(hor,mid,smoothstep(0.0,0.25,h));c=mix(c,top,smoothstep(0.25,0.8,h));if(h<0.0)c=hor;gl_FragColor=vec4(c,1.0);}'
});
const sky=new THREE.Mesh(new THREE.SphereGeometry(250,24,12),skyMat);sky.renderOrder=-10;skyGroup.add(sky);

function canvasTex(w,h,draw){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;
}
const tx=(base,rx,ry)=>{const t=base.clone();t.needsUpdate=true;t.repeat.set(rx,ry);return t};

const glowTex=canvasTex(128,128,(g)=>{const gr=g.createRadialGradient(64,64,4,64,64,62);gr.addColorStop(0,'rgba(255,245,210,1)');gr.addColorStop(0.25,'rgba(255,210,140,0.65)');gr.addColorStop(1,'rgba(255,170,100,0)');g.fillStyle=gr;g.fillRect(0,0,128,128)});
glowTex.wrapS=glowTex.wrapT=THREE.ClampToEdgeWrapping;
const sunSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,depthWrite:false,fog:false}));
const SUNV=SUNDIR.clone();
sunSprite.scale.set(110,110,1);sunSprite.position.copy(SUNDIR).multiplyScalar(225);sunSprite.renderOrder=-9;skyGroup.add(sunSprite);

const hemi=new THREE.HemisphereLight(0xcfe3ff,0x7a7a5a,0.78);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe7c2,0.95);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
const shc=sun.shadow.camera;shc.left=-48;shc.right=48;shc.top=48;shc.bottom=-48;shc.near=1;shc.far=180;
sun.shadow.bias=-0.0007;
scene.add(sun);scene.add(sun.target);

// clouds
const clouds=[];
const cloudMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.82,fog:false,depthWrite:false});
for(let i=0;i<9;i++){
  const g=new THREE.Group();
  for(let k=0;k<4;k++){const s=new THREE.Mesh(new THREE.SphereGeometry(7+Math.random()*5,8,6),cloudMat);s.position.set(k*8-12,Math.random()*3,Math.random()*5);s.scale.y=0.5;g.add(s)}
  g.position.set(Math.random()*400-200,70+Math.random()*30,Math.random()*400-200);scene.add(g);clouds.push(g);
}

// =============== textures ===============
const grassBase=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#4f9a44';g.fillRect(0,0,w,h);for(let i=0;i<900;i++){const v=Math.random();g.fillStyle=v<0.5?'#5aa84d':'#418a39';g.fillRect(Math.random()*w,Math.random()*h,2,3)}});
const asphaltBase=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#3b3b3f';g.fillRect(0,0,w,h);for(let i=0;i<1500;i++){const v=40+Math.random()*42|0;g.fillStyle=`rgb(${v},${v},${v+3})`;g.fillRect(Math.random()*w,Math.random()*h,2,2)}});
const paveBase=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#bdb9b0';g.fillRect(0,0,w,h);g.strokeStyle='#9d9990';g.lineWidth=2;for(let i=0;i<=w;i+=32){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke()}});
const WLAY=[];for(let i=0;i<16;i++)WLAY.push(Math.random()<0.3);
function drawWin(g,w,h,litMode){
  g.fillStyle=litMode?'#000000':'#ffffff';g.fillRect(0,0,w,h);
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const x=c*64+12,y=r*64+14,lit=WLAY[r*4+c];
    if(litMode){if(lit){g.fillStyle='#ffd27a';g.fillRect(x,y,40,36)}continue}
    g.fillStyle='#59616e';g.fillRect(x-2,y-2,44,40);
    g.fillStyle=lit?'#ffe08a':(((r+c)%2)?'#26364f':'#324a6b');g.fillRect(x,y,40,36);
    g.fillStyle='rgba(255,255,255,0.18)';g.fillRect(x,y,40,10);
  }
  if(!litMode){g.fillStyle='rgba(0,0,0,0.07)';for(let i=0;i<h;i+=64)g.fillRect(0,i+58,w,5)}
}
const winBase=canvasTex(256,256,(g,w,h)=>drawWin(g,w,h,false));
const winLitBase=canvasTex(256,256,(g,w,h)=>drawWin(g,w,h,true));
const stripeBase=canvasTex(64,64,(g,w,h)=>{g.fillStyle='#d32f2f';g.fillRect(0,0,w,h);g.fillStyle='#ffffff';for(let i=0;i<w;i+=32)g.fillRect(i,0,16,h)});
const winCache={},litCache={};
function winTex(rx,ry){const k=rx+'x'+ry;return winCache[k]||(winCache[k]=tx(winBase,rx,ry))}
function litTex(rx,ry){const k=rx+'x'+ry;return litCache[k]||(litCache[k]=tx(winLitBase,rx,ry))}

// =============== world ===============
const ROAD=12,BLOCK=40;
const solids=[];
function inst(geo,mat,list,cast){
  const m=new THREE.InstancedMesh(geo,mat,list.length);const d=new THREE.Object3D();
  list.forEach((p,i)=>{d.position.set(p[0],p[1],p[2]);d.rotation.set(0,p[3]||0,0);d.scale.set(p[4]||1,p[5]||1,p[4]||1);d.updateMatrix();m.setMatrixAt(i,d.matrix)});
  m.instanceMatrix.needsUpdate=true;m.castShadow=!!cast;m.receiveShadow=true;m.frustumCulled=false;scene.add(m);return m;
}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshLambertMaterial({map:tx(grassBase,125,125)}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const roadMatH=new THREE.MeshLambertMaterial({map:tx(asphaltBase,50,1.5),polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1});
const roadMatV=new THREE.MeshLambertMaterial({map:tx(asphaltBase,1.5,50),polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
const lineMat=new THREE.MeshLambertMaterial({color:0xffc107,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4});
for(let i=-5;i<=5;i++){
  const h=new THREE.Mesh(new THREE.PlaneGeometry(400,ROAD),roadMatH);h.rotation.x=-Math.PI/2;h.position.set(0,0.02,i*BLOCK);h.receiveShadow=true;scene.add(h);
  const v=new THREE.Mesh(new THREE.PlaneGeometry(ROAD,400),roadMatV);v.rotation.x=-Math.PI/2;v.position.set(i*BLOCK,0.02,0);v.receiveShadow=true;scene.add(v);
  for(const o of [-0.25,0.25]){
    const l1=new THREE.Mesh(new THREE.PlaneGeometry(400,0.18),lineMat);l1.rotation.x=-Math.PI/2;l1.position.set(0,0.03,i*BLOCK+o);scene.add(l1);
    const l2=new THREE.Mesh(new THREE.PlaneGeometry(0.18,400),lineMat);l2.rotation.x=-Math.PI/2;l2.position.set(i*BLOCK+o,0.03,0);scene.add(l2);
  }
}
// dashed lane lines + crosswalks
const whiteMat=new THREE.MeshLambertMaterial({color:0xf2f2f2});
const dashH=[],dashV=[],crossH=[],crossV=[];
for(let i=-4;i<=4;i++){
  for(let p=-156;p<=156;p+=6){
    const dd=Math.abs(p-Math.round(p/BLOCK)*BLOCK);
    if(dd<10)continue;
    for(const o of [-3,3]){dashH.push([p,0.05,i*BLOCK+o]);dashV.push([i*BLOCK+o,0.05,p])}
  }
}
for(let i=-4;i<=4;i++)for(let j=-4;j<=4;j++){
  const X=i*BLOCK,Z=j*BLOCK;
  for(const s of [-8,8])for(let k=-5;k<=5;k+=1.7){
    crossH.push([X+s,0.05,Z+k]); // stripes on the east-west road
    crossV.push([X+k,0.05,Z+s]); // stripes on the north-south road
  }
}
inst(new THREE.BoxGeometry(3,0.02,0.25),whiteMat,dashH,false);
inst(new THREE.BoxGeometry(0.25,0.02,3),whiteMat,dashV,false);
inst(new THREE.BoxGeometry(2.4,0.02,0.8),whiteMat,crossH,false);
inst(new THREE.BoxGeometry(0.8,0.02,2.4),whiteMat,crossV,false);

// =============== Lagos districts & city generation ===============
const DIST={vi:'Victoria Island',lekki:'Lekki',ikeja:'Ikeja',surulere:'Surulere',market:'Mainland Market'};
function districtOf(bx,bz){
  if(Math.abs(bx+0.5)<2&&Math.abs(bz+0.5)<2)return 'vi';
  if(bx>=2)return 'lekki';
  if(bx<=-3)return bz<=-1?'ikeja':'surulere';
  return 'market';
}
function districtAt(x,z){
  const bx=Math.floor(x/BLOCK),bz=Math.floor(z/BLOCK);
  if(bx<-4||bx>3||bz<-4||bz>3)return null;
  return DIST[districtOf(bx,bz)];
}
let seed=7;function sr(){seed=(seed*16807)%2147483647;return seed/2147483647}
const pick=a=>a[Math.floor(sr()*a.length)];
function solid(x,z,hw,hd){solids.push({x,z,hw,hd})}

  u.body.rotation.x+=(pt-u.body.rotation.x)*k2;u.body.rotation.z+=(rl-u.body.rotation.z)*k2;
  const br=iy>0.1&&spd>1;u.tailMats.forEach(m=>m.color.setHex(br?0xff3b2f:0x8a1410));

let ac=null,muted=false,eng=null;
function audioInit(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.resume)ac.resume();
    if(!eng){
      const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();
      o.type='sawtooth';o.frequency.value=50;f.type='lowpass';f.frequency.value=320;g.gain.value=0;
      o.connect(f);f.connect(g);g.connect(ac.destination);o.start();eng={o,g};
    }
  }catch(e){}
}
function beep(freq,dur,type,vol,when){
  if(!ac||muted)return;
  const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=freq;
  o.connect(g);g.connect(ac.destination);const t=ac.currentTime+(when||0);
  g.gain.setValueAtTime(vol||0.06,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.02);
}

  const m=Math.min(R,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
  dx=Math.cos(a)*m;dy=Math.sin(a)*m;

}

function collide(nx,nz){
  for(const s of solids)if(Math.abs(nx-s.x)<s.hw&&Math.abs(nz-s.z)<s.hd)return true;
  return Math.abs(nx)>190||Math.abs(nz)>190;
}
function updateUse(){
  let t=null,label='';
  if(myCol>=0){t={type:'exit'};label='EXIT CAR'}
  else{
    let sp=null;
    if(world&&world.spots){for(const s of world.spots)if(Math.hypot(s.x-pos.x,s.z-pos.z)<7){sp=s;break}}
    if(!sp&&world){for(const hh of world.houses)if(houseObjs[hh.id].owner===myName&&Math.hypot(hh.x-pos.x,hh.z-pos.z)<10){sp={id:'home',icon:'🏠',name:'Home',opts:world.homeOpts};break}}
    let bd=5,bc=null;
    for(const pc of parked){const d=Math.hypot(pc.x-pos.x,pc.z-pos.z);if(d<bd){bd=d;bc=pc}}
    if(sp){t={type:'spot',spot:sp};label=sp.icon+' '+sp.name}else if(bc){t={type:'enter',car:bc};label='🚗 DRIVE'}
    else if(world){
      for(const h of world.houses){
        if(Math.hypot(h.x-pos.x,h.z-pos.z)<9&&!houseObjs[h.id].owner){t={type:'buy'};label=`🏠 BUY ₦${h.price.toLocaleString('en-US')}`;break}
      }
    }
  }
  useTarget=jailed?null:t;
  if(useTarget){useBtn.style.display='block';if(useBtn.textContent!==label)useBtn.textContent=label}
  else useBtn.style.display='none';
}

// =============== main loop ===============
let last=performance.now(),uc=0,tAcc=0,dustT=0,tc=0;
function wrap(a){return ((a+Math.PI*3)%(Math.PI*2))-Math.PI}
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-last)/1000);last=now;tAcc+=dt;
  let ix=joy.x,iy=joy.y;
  if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;
  if(keys.w||keys.arrowup)iy-=1;if(keys.s||keys.arrowdown)iy+=1;
  if(keys.q)camYaw+=dt*2;if(keys.e)camYaw-=dt*2;
  const mag=Math.min(1,Math.hypot(ix,iy));
  moving=false;
  if(me){
    if(!jailed&&!busyNow){
      if(myCol>=0){
        const thr=-iy;
        if(thr>0.1)speed+=thr*22*dt;else if(thr<-0.1)speed+=thr*26*dt;else speed*=(1-1.6*dt);
        const vmax=myCol===6?17:myCol===5?22:28;speed=Math.max(-8,Math.min(vmax,speed));
        pos.ry-=ix*1.9*dt*Math.min(1,Math.abs(speed)/6)*(speed>=0?1:-1);
        const nx=pos.x+Math.sin(pos.ry)*speed*dt,nz=pos.z+Math.cos(pos.ry)*speed*dt;
        if(!collide(nx,nz)){pos.x=nx;pos.z=nz}
        else if(!collide(nx,pos.z))pos.x=nx;
        else if(!collide(pos.x,nz))pos.z=nz;
        else speed*=-0.3;
        moving=Math.abs(speed)>0.5;
        camYaw+=wrap(pos.ry-camYaw)*0.08;
        dustT+=dt;if(Math.abs(speed)>10&&dustT>0.06){dustT=0;puff(pos.x-Math.sin(pos.ry)*2.2+(Math.random()-0.5),pos.z-Math.cos(pos.ry)*2.2+(Math.random()-0.5))}
      }else if(mag>0.15){
        const vx=-iy*Math.sin(camYaw)-ix*Math.cos(camYaw);
        const vz=-iy*Math.cos(camYaw)+ix*Math.sin(camYaw);
        const sp=9*(meSt?meSt.speed:1)*(meSt&&meSt.n.energy<12?0.65:1)*mag*dt;
        const nx=pos.x+vx*sp,nz=pos.z+vz*sp;
        if(!collide(nx,pos.z))pos.x=nx;
        if(!collide(pos.x,nz))pos.z=nz;
        pos.ry=Math.atan2(vx,vz);moving=true;
      }
    }
    me.position.set(pos.x,0,pos.z);
    me.rotation.y=myCol>=0?pos.ry:me.rotation.y+wrap(pos.ry-me.rotation.y)*0.2;
    animate(me,moving&&myCol<0,dt);
    if(myCol>=0)driveFx(me.userData.carG,speed,ix,iy,dt);
    const cd=myCol>=0?13:11,ch=myCol>=0?Math.max(5,camH*0.85):camH;
    const gx=pos.x-Math.sin(camYaw)*cd,gz=pos.z-Math.cos(camYaw)*cd;
    if(!camInit){camera.position.set(gx,ch,gz);camInit=true}
    const k=Math.min(1,dt*9);
    camera.position.x+=(gx-camera.position.x)*k;camera.position.y+=(ch-camera.position.y)*k;camera.position.z+=(gz-camera.position.z)*k;
    camera.lookAt(pos.x,2,pos.z);
    sun.position.set(pos.x+SUNV.x*80,SUNV.y*80,pos.z+SUNV.z*80);sun.target.position.set(pos.x,0,pos.z);
    if(myCol>=0){const fx=Math.sin(pos.ry),fz=Math.cos(pos.ry);myBeam.position.set(pos.x+fx*2.4,0.9,pos.z+fz*2.4);myBeam.target.position.set(pos.x+fx*24,0,pos.z+fz*24);myBeam.intensity=curNight*1.6}else myBeam.intensity=0;
    if(++uc%6===0)updateUse();
    if(++tc%20===0){updateTime();updateDistrict()}
    const sp=document.getElementById('speedo');
    if(myCol>=0){sp.style.display='block';document.getElementById('spd').textContent=String(Math.round(Math.abs(speed)*3.6)).padStart(3,'0')}else sp.style.display='none';
    if(eng&&ac){eng.g.gain.value=(!muted&&myCol>=0)?0.015+0.03*Math.abs(speed)/28:0;eng.o.frequency.value=48+Math.abs(speed)*4.5}
  }else{camera.position.set(0,40,60);camera.lookAt(0,0,0)}
  skyGroup.position.copy(camera.position);
  for(const c of clouds){c.position.x+=dt*1.6;if(c.position.x>230)c.position.x=-230}
  for(const id in others){
    const o=others[id];
    o.g.position.x+=(o.tx-o.g.position.x)*0.25;o.g.position.z+=(o.tz-o.g.position.z)*0.25;
    o.g.rotation.y+=wrap(o.try-o.g.rotation.y)*0.2;
    const inCar=o.g.userData.curCar>=0;
    animate(o.g,o.moving&&!inCar,dt);
    if(inCar)driveFx(o.g.userData.carG,o.moving?14:0,0,0,dt);
    if(inCar&&o.moving&&Math.random()<0.2)puff(o.g.position.x-Math.sin(o.g.rotation.y)*2.2,o.g.position.z-Math.cos(o.g.rotation.y)*2.2);
  }
  // sirens
  const ph=Math.floor(tAcc*4)%2===0;
  const sirenOf=g=>g&&g.userData.carG&&g.userData.carG.userData.siren;
  let s=sirenOf(me);if(s){s[0].visible=ph;s[1].visible=!ph}
  for(const id in others){s=sirenOf(others[id].g);if(s){s[0].visible=ph;s[1].visible=!ph}}
  updateDust(dt);updateRain(dt);
  renderer.render(scene,camera);
}

// =============== minimap + leaderboard + wanted ===============
const ROLECOL={police:'#4b7bff',thief:'#ff5252',nurse:'#3fd0d8',lawyer:'#bbbbbb',taxi:'#fdd835'};
const mmEl=document.getElementById('mm'),mmg=mmEl.getContext('2d');
let lastPlayers=[],lastOwners={};
function drawMinimap(){
  const W=220,R=W/2,range=90,k=R/range;
  mmg.clearRect(0,0,W,W);mmg.save();mmg.beginPath();mmg.arc(R,R,R-2,0,7);mmg.clip();
  mmg.translate(R,R);mmg.rotate(camYaw);           // map turns with the camera
  mmg.translate(-pos.x*k,-pos.z*k);
  mmg.fillStyle='#ffffff22';                       // roads
  for(let i=-5;i<=5;i++){mmg.fillRect(-200*k,(i*BLOCK-ROAD/2)*k,400*k,ROAD*k);mmg.fillRect((i*BLOCK-ROAD/2)*k,-200*k,ROAD*k,400*k)}
  const dot=(x,z,c,r)=>{mmg.fillStyle=c;mmg.beginPath();mmg.arc(x*k,z*k,r,0,7);mmg.fill()};
  if(world){world.houses.forEach(h=>dot(h.x,h.z,houseObjs[h.id]&&houseObjs[h.id].owner?'#ffd54a':'#7CFC8A',5));
    world.shops.forEach(s=>dot(s.x,s.z,'#ff9800',5));dot(world.jail.x,world.jail.z,'#ff8a80',7)}
  const blink=Math.floor(performance.now()/300)%2===0;
  lastPlayers.forEach(p=>{if(p.id===myId)return;
    if(p.role==='thief'&&!p.wanted&&myRole!=='thief')return;   // thieves only show when wanted
    if(p.wanted){if(blink||myRole==='police')dot(p.x,p.z,'#ff1744',6)}
    else dot(p.x,p.z,ROLECOL[p.role]||'#fff',4)});
  mmg.restore();
  mmg.fillStyle='#fff';mmg.beginPath();mmg.moveTo(R,R-8);mmg.lineTo(R-6,R+6);mmg.lineTo(R+6,R+6);mmg.fill();
}
function drawBoard(){
  const top=lastPlayers.slice().sort((a,b)=>b.money-a.money).slice(0,4);
  document.getElementById('board').innerHTML='\ud83c\udfc6 '+top.map((p,i)=>`${i+1}. ${p.name.replace(/</g,'')} <b>$${p.money}</b>`).join('<br>');
}
let mmT=0;setInterval(()=>{if(me){drawMinimap();if(++mmT%5===0)drawBoard()}},100);

// =============== life sim: needs, places, phone, rain ===============
let meSt=null,busyNow=false,busyEnd=0,busyTotal=1,phoneTab='me',spotOpen=null;
const E=id=>document.getElementById(id);
const fmt=n=>'₦'+Number(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NEEDI=[['energy','⚡','Energy'],['hunger','🍔','Hunger'],['hygiene','🚿','Hygiene'],['fun','🎮','Fun']];
const ITEMN={phone:'📱 iPhone 15 — +5% pay',laptop:'💻 MacBook Pro — +10% desk-job pay',clothes:'👕 Designer clothes — +8% pay',shoes:'👟 Jordan 1s — run 12% faster',watch:'⌚ Rolex — +12% pay',gen:'🔌 Generator — NEPA can\'t stop you'};
const nc=v=>v>50?'#4cd964':v>25?'#ffb300':'#ff5252';
function onMe(m){
  meSt=m;busyNow=!!m.busy;
  if(m.busy){busyEnd=performance.now()+m.busy.left;busyTotal=Math.max(1,m.busy.total);E('busyl').textContent=m.busy.label+'...';spotClose()}
  E('needs').innerHTML=NEEDI.map(([k,i])=>`<div class="nd">${i}<i><b style="width:${m.n[k]}%;background:${nc(m.n[k])}"></b></i></div>`).join('');
  if(E('phoneov').style.display==='flex')renderPhone();
  if(spotOpen&&E('spotov').style.display==='flex')openSpot(spotOpen);
}
const SPOTCOL={amala:0xc8742a,club:0x8e24aa,bank:0x1565c0,corp:0x455a64,market:0xd84315,cv:0x00838f,hosp:0xe53935,gym:0x37474f,church:0xe8e0c8,hostel:0x6d4c41,office:0x546e7a,danfo:0xf2b705};
function buildSpots(w){
  (w.spots||[]).forEach(s=>{
    const col=SPOTCOL[s.id]||0x888888,g=new THREE.Group();
    const add=(sx,sy,sz,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m)};
    add(3.4,0.25,2.6,0xcfcac0,0,0.12,0);add(3,1.1,1.1,col,0,0.8,-0.5);add(3.2,0.18,2.2,col,0,3.1,0);
    [[-1.5,-1],[1.5,-1],[-1.5,1],[1.5,1]].forEach(([x,z])=>add(0.12,2.9,0.12,0xdddddd,x,1.6,z));
    g.position.set(s.x,0,s.z);scene.add(g);
    const beam=new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.9,14,14,1,true),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.17,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,fog:false}));
    beam.position.set(s.x,7,s.z);scene.add(beam);
    g.add(makeLabel(s.icon+' '+s.name,'#fff',4.8,4.6));
    solids.push({x:s.x,z:s.z,hw:1.9,hd:1.6});
  });
}
function openSpot(s){
  spotOpen=s;E('smt').textContent=s.icon+' '+s.name;
  const have=meSt?meSt.items:[];
  E('smo').innerHTML=s.opts.map(o=>{
    let right='',sub='',dis='';
    if(o.kind==='act'){right=o.cost?fmt(o.cost):'Free';sub=o.secs+' sec'}
    else if(o.kind==='work'){right='+'+fmt(o.pay);const lock=meSt&&meSt.shifts<o.req;sub=o.req?`needs ${o.req} shifts (you: ${meSt?meSt.shifts:0})`:'one shift, '+o.secs+' sec';if(lock)dis=' disabled'}
    else if(o.kind==='buy'){const own=have.includes(o.item);right=own?'✔ Owned':fmt(o.cost);sub=o.desc||'';if(own)dis=' disabled'}
    else if(o.kind==='bank'){sub=meSt?`Wallet ${fmt(meSt.money)} • Bank ${fmt(meSt.bank)}`:''}
    if(o.power)sub+=(sub?' • ':'')+'⚡ needs light';
    return `<button class="ob" data-o="${o.id}"${dis}><span>${o.label}<small>${sub}</small></span><em>${right}</em></button>`;
  }).join('');
  E('spotov').style.display='flex';
}
function spotClose(){E('spotov').style.display='none';spotOpen=null}
E('smx').onclick=spotClose;
E('smo').onclick=e=>{
  const b=e.target.closest('button[data-o]');if(!b||b.disabled||!ws)return;
  const id=b.dataset.o;ws.send(JSON.stringify({t:'use',opt:id}));audioInit();
  if(!/^(dep|with)/.test(id))spotClose();
};
function renderPhone(){
  const m=meSt,c=E('pc');
  if(!m){c.textContent='Connecting...';return}
  if(phoneTab==='me'){
    const rank=m.shifts<3?'Newbie':m.shifts<6?'Hustler':m.shifts<12?'Professional':'Big Boy';
    c.innerHTML=`<h3>${fmt(m.money)} <small style="opacity:.7;font-size:12px">wallet</small></h3><div style="font-size:13px;margin-bottom:10px">🏦 Bank ${fmt(m.bank)} • 💼 ${rank} (${m.shifts} shifts)<br>${m.low?`😟 ${m.low} need${m.low>1?'s':''} low — pay −${m.low*10}%`:'😄 Mood good'}</div>`+
      NEEDI.map(([k,i,n])=>`${i} ${n} ${Math.round(m.n[k])}%<div class="bar"><b style="width:${m.n[k]}%;background:${nc(m.n[k])}"></b></div>`).join('')+
      `<div style="font-size:11px;opacity:.7">Eat at Amala Shitta, sleep at the hostel or your own house, then work shifts to earn. Hit 0 hunger or energy and you collapse.</div>`;
  }else if(phoneTab==='bag'){
    c.innerHTML=m.items.length?m.items.map(i=>`<div class="pp"><span>${ITEMN[i]||i}</span></div>`).join(''):'<div style="opacity:.7;font-size:13px">Your bag is empty. Visit Balogun Market or Computer Village.</div>';
  }else{
    const ps=lastPlayers.slice().sort((a,b)=>b.money-a.money);
    c.innerHTML='<div style="font-size:12px;opacity:.7;margin-bottom:4px">🏆 Richest first • tap to send money</div>'+ps.map((p,i)=>`<div class="pp"><span>${i+1}. ${ROLES[p.role].emoji} ${esc(p.name)}${p.id===myId?' (you)':''}<br><small style="opacity:.7">${fmt(p.money)}</small></span><span>${p.id===myId?'':`<button data-s="${p.id}:1000">₦1k</button><button data-s="${p.id}:5000">₦5k</button>`}</span></div>`).join('');
  }
}
E('phonebtn').onclick=()=>{E('phoneov').style.display='flex';renderPhone()};
E('phx').onclick=()=>{E('phoneov').style.display='none'};
E('ptabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;phoneTab=b.dataset.t;[...E('ptabs').children].forEach(x=>x.classList.toggle('sel',x===b));renderPhone()};
E('pc').onclick=e=>{const b=e.target.closest('button[data-s]');if(!b||!ws)return;const [id,amt]=b.dataset.s.split(':');ws.send(JSON.stringify({t:'send',to:+id,amt:+amt}))};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();
  if(k==='e')useBtn.click();else if(k==='f')E('act').click();else if(k==='p')E('phonebtn').click();
  else if(k==='escape'){spotClose();E('phoneov').style.display='none'}
});
setInterval(()=>{
  const b=E('busy');
  if(busyNow){b.style.display='block';E('busyf').style.width=Math.max(0,Math.min(100,100*(1-(busyEnd-performance.now())/busyTotal)))+'%'}
  else b.style.display='none';
},100);
// rain
const RN=500,rainPos=new Float32Array(RN*6);
for(let i=0;i<RN;i++){const x=(Math.random()-0.5)*70,y=Math.random()*38,z=(Math.random()-0.5)*70;rainPos.set([x,y,z,x-0.15,y-1.6,z-0.05],i*6)}
const rainGeo=new THREE.BufferGeometry();rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));
const rainMesh=new THREE.LineSegments(rainGeo,new THREE.LineBasicMaterial({color:0xb8c7dc,transparent:true,opacity:0,fog:false,depthWrite:false}));
rainMesh.frustumCulled=false;rainMesh.visible=false;scene.add(rainMesh);
const myBeam=new THREE.SpotLight(0xfff1cc,0,48,0.5,0.6,1);scene.add(myBeam);scene.add(myBeam.target);
function updateRain(dt){
  rainAmt+=((wantRain?1:0)-rainAmt)*Math.min(1,dt*0.6);
  rainMesh.visible=rainAmt>0.03;if(!rainMesh.visible)return;
  rainMesh.material.opacity=rainAmt*0.55;rainMesh.position.set(camera.position.x,0,camera.position.z);
  const a=rainGeo.attributes.position.array,d=dt*34;
  for(let i=0;i<RN;i++){const o=i*6;a[o+1]-=d;a[o+4]-=d;if(a[o+4]<0){a[o+1]+=38;a[o+4]+=38}}
  rainGeo.attributes.position.needsUpdate=true;
}

requestAnimationFrame(loop);
