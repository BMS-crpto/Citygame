<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Life — Avatar Studio</title>
<style>
:root{color-scheme:dark;--bg:#10141d;--panel:#1b2330;--accent:#ffb22e;--muted:#9aa8bb}
*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:radial-gradient(circle at top,#26354b,#10141d 55%);color:#f5f7fb;min-height:100vh}
header{padding:22px;text-align:center}header h1{margin:0;color:var(--accent)}header p{color:var(--muted);margin:6px}
main{max-width:900px;margin:auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:var(--panel);border:1px solid #344154;border-radius:18px;padding:18px;box-shadow:0 12px 35px #0004}
.preview{min-height:390px;display:grid;place-items:center;background:linear-gradient(#34475e,#18202b);border-radius:14px;position:relative;overflow:hidden}.preview:after{content:"";position:absolute;bottom:0;height:28%;width:100%;background:linear-gradient(#293543,#111820);border-top:2px solid #566271}
#avatar3d{width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}#avatar3d:active{cursor:grabbing}.preview{background:radial-gradient(ellipse at 50% 35%,#1b4255,#08131d 72%)!important;border:1px solid #67e8e833;box-shadow:inset 0 1px 0 #ffffff12,0 14px 30px #0006}.preview:after{height:20%;background:linear-gradient(#102b38,#071018);border-top:1px solid #67e8e844}.previewHint{position:absolute;top:12px;z-index:2;font-size:10px;letter-spacing:1.5px;color:#8fe8ed;background:#06121bcc;border:1px solid #67e8e833;padding:6px 9px;border-radius:5px;pointer-events:none}label{display:block;margin:13px 0 6px;color:#d8e0ec;font-weight:600}select,input[type=color]{width:100%;padding:10px;border-radius:10px;border:1px solid #445268;background:#111923;color:white}button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:11px;background:var(--accent);font-weight:800;color:#211707}small{color:var(--muted)}@media(max-width:650px){main{grid-template-columns:1fr}.preview{min-height:350px}}

:root{color-scheme:dark;--bg:#06111b;--panel:#0d1c29;--accent:#67e8e8;--muted:#9db8c6}
body{background:radial-gradient(ellipse at 50% 0%,#17384a,#06111b 62%);font-family:Inter,"Poppins",system-ui,sans-serif}
header h1{color:#c8ffff;text-shadow:0 0 22px #67e8e833;letter-spacing:2px}
.panel{background:linear-gradient(145deg,#142b3a,#07131d);border:1px solid #67e8e82e;border-radius:14px;box-shadow:0 1px 0 #ffffff10 inset,0 18px 40px #0007}
h2{color:#e8fcff}
label{color:#b9d8e3}
select,input[type=color]{background:linear-gradient(180deg,#102432,#07131d);border:1px solid #67e8e833;border-radius:9px;color:#eafcff;box-shadow:inset 0 2px 8px #0007}
button{background:linear-gradient(145deg,#c8ffff,#67e8e8 55%,#d6a75a);color:#07131d;border-radius:10px;box-shadow:0 1px 0 #ffffffaa inset,0 -3px 0 #0003 inset,0 9px 22px #0006;letter-spacing:.6px}
.preview{border-radius:12px;height:390px}@media(max-width:650px){.preview{height:350px}}
</style></head><body>
<header><h1>👤 AVATAR STUDIO</h1><p>Customize your City Life character</p></header>
<main><section class="panel"><div class="preview" id="avatarPreview"><canvas id="avatar3d" aria-label="Rotatable 3D character preview"></canvas><div class="previewHint">DRAG TO ROTATE • LIVE 3D</div></div><small>3D preview updates as you customize. Drag the character to turn it.</small></section>
<section class="panel"><h2>Appearance</h2>
<label for="skin">Skin tone</label><select id="skin"><option value="#f1c7a5">Light</option><option value="#c98e65">Medium</option><option value="#8d5638" selected>Deep</option><option value="#573321">Dark</option></select>
<label for="hair">Hair color</label><select id="hair"><option value="#24170e">Black</option><option value="#55301b">Brown</option><option value="#b87928">Blonde</option><option value="#8b2635">Burgundy</option></select>
<label for="style">Hair style</label><select id="style"><option value="short">Short</option><option value="fade">Fade</option><option value="afro">Afro</option></select>
<label for="shirt">Shirt color</label><input type="color" id="shirt" value="#e14c37">
<label for="pants">Trousers color</label><input type="color" id="pants" value="#263f75">
<label for="shoes">Shoes color</label><input type="color" id="shoes" value="#f2f2f2">
<label for="path">Life path</label><select id="path"><option>Nepo Baby</option><option>LAPO Baby</option></select>
<button id="save">Save character</button><p id="status" aria-live="polite"></p>
</section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const ids=['skin','hair','style','shirt','pants','shoes','path'];
let avatarScene,avatarCamera,avatarRenderer,avatarRoot,avatarMaterials={},avatarHair=null;
function initAvatar3D(){
 const cv=document.getElementById('avatar3d'),host=document.getElementById('avatarPreview');
 avatarScene=new THREE.Scene();avatarScene.background=new THREE.Color(0x0a1622);avatarScene.fog=new THREE.Fog(0x0a1622,7,18);
 avatarCamera=new THREE.PerspectiveCamera(32,1,.1,40);avatarCamera.position.set(0,2.15,7.6);avatarCamera.lookAt(0,1.55,0);
 avatarRenderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:false,powerPreference:'low-power'});
 avatarRenderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));avatarRenderer.shadowMap.enabled=true;avatarRenderer.shadowMap.type=THREE.PCFSoftShadowMap;
 if('outputColorSpace' in avatarRenderer&&THREE.SRGBColorSpace)avatarRenderer.outputColorSpace=THREE.SRGBColorSpace;else avatarRenderer.outputEncoding=THREE.sRGBEncoding;avatarRenderer.toneMapping=THREE.ACESFilmicToneMapping;avatarRenderer.toneMappingExposure=1.05;
 avatarScene.add(new THREE.HemisphereLight(0xc9edff,0x27313b,1.25));
 const key=new THREE.DirectionalLight(0xffe2bd,2.1);key.position.set(-3,5,4);key.castShadow=true;key.shadow.mapSize.set(512,512);avatarScene.add(key);
 const rim=new THREE.DirectionalLight(0x58d9e7,1.2);rim.position.set(3,3,-4);avatarScene.add(rim);
 const floor=new THREE.Mesh(new THREE.CircleGeometry(2.5,48),new THREE.MeshStandardMaterial({color:0x102b38,roughness:.72,metalness:.12}));floor.rotation.x=-Math.PI/2;floor.position.y=.015;floor.receiveShadow=true;avatarScene.add(floor);
 const ring=new THREE.Mesh(new THREE.RingGeometry(1.45,1.52,64),new THREE.MeshBasicMaterial({color:0x67e8e8,transparent:true,opacity:.65,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.025;avatarScene.add(ring);
 avatarRoot=new THREE.Group();avatarScene.add(avatarRoot);
 const mat=(color,roughness=.68)=>new THREE.MeshStandardMaterial({color,roughness,metalness:.02});
 avatarMaterials.skin=mat('#8d5638');avatarMaterials.hair=mat('#24170e',.82);avatarMaterials.shirt=mat('#e14c37');avatarMaterials.pants=mat('#263f75');avatarMaterials.shoes=mat('#f2f2f2',.5);
 const add=(geo,m,x,y,z,scale)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);if(scale)o.scale.set(...scale);o.castShadow=true;o.receiveShadow=true;avatarRoot.add(o);return o};
 const sph=(m,x,y,z,s)=>add(new THREE.SphereGeometry(1,24,18),m,x,y,z,s);
 const cyl=(m,rt,rb,h,x,y,z,n=20)=>add(new THREE.CylinderGeometry(rt,rb,h,n),m,x,y,z);
 // Anatomical, smooth 3D silhouette built from curved geometry rather than square block limbs.
 cyl(avatarMaterials.skin,.13,.14,.24,0,1.48,0);
 sph(avatarMaterials.skin,0,1.83,0,[.34,.43,.31]);
 // ears, nose and subtle eyes provide a readable face at the preview camera distance
 sph(avatarMaterials.skin,-.34,1.83,0,[.075,.11,.07]);sph(avatarMaterials.skin,.34,1.83,0,[.075,.11,.07]);
 sph(avatarMaterials.skin,0,1.78,.29,[.075,.11,.08]);
 const eye=mat('#17212a',.35);sph(eye,-.12,1.91,.285,[.035,.04,.022]);sph(eye,.12,1.91,.285,[.035,.04,.022]);
 // torso and softly rounded shoulders
 cyl(avatarMaterials.shirt,.36,.28,.82,0,1.02,0,24);sph(avatarMaterials.shirt,-.31,1.34,0,[.19,.2,.2]);sph(avatarMaterials.shirt,.31,1.34,0,[.19,.2,.2]);
 // arms, hands
 for(const side of [-1,1]){const x=side*.47;cyl(avatarMaterials.shirt,.13,.105,.48,x,1.12,0,18);sph(avatarMaterials.shirt,x,1.34,0,[.14,.15,.14]);cyl(avatarMaterials.skin,.085,.075,.32,x,.72,0,16);sph(avatarMaterials.skin,x,.53,.02,[.09,.1,.09]);}
 // legs, knees and footwear are grouped for a more natural tapered form
 for(const side of [-1,1]){const x=side*.16;cyl(avatarMaterials.pants,.145,.11,.62,x,.43,0,18);sph(avatarMaterials.pants,x,.17,0,[.12,.12,.13]);sph(avatarMaterials.shoes,x,.095,.105,[.14,.085,.23]);}
 avatarHair=sph(avatarMaterials.hair,0,2.13,-.015,[.34,.21,.32]);
 resize();let drag=false,lastX=0;
 host.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;host.setPointerCapture(e.pointerId)});
 host.addEventListener('pointermove',e=>{if(!drag)return;avatarRoot.rotation.y+=(e.clientX-lastX)*.012;lastX=e.clientX});
 host.addEventListener('pointerup',()=>drag=false);host.addEventListener('pointercancel',()=>drag=false);
 addEventListener('resize',resize);
 function resize(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;avatarCamera.aspect=w/h;avatarCamera.updateProjectionMatrix();avatarRenderer.setSize(w,h,false)}
 function frame(){requestAnimationFrame(frame);avatarRenderer.render(avatarScene,avatarCamera)}frame();
}
function apply(){
 const v=Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value]));
 if(avatarMaterials.skin)avatarMaterials.skin.color.set(v.skin);
 if(avatarMaterials.hair)avatarMaterials.hair.color.set(v.hair);
 if(avatarMaterials.shirt)avatarMaterials.shirt.color.set(v.shirt);
 if(avatarMaterials.pants)avatarMaterials.pants.color.set(v.pants);
 if(avatarMaterials.shoes)avatarMaterials.shoes.color.set(v.shoes);
 if(avatarHair){avatarHair.scale.set(v.style==='afro'?.43:.34,v.style==='afro'?.24:v.style==='fade'?.13:.19,.34);avatarHair.position.y=v.style==='afro'?2.17:2.13;}
}
ids.forEach(id=>document.getElementById(id).addEventListener('input',apply));
function rgb(hex){hex=hex.replace('#','');return [parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];}
function nearest(hex,palette){const c=rgb(hex);let best=0,dist=Infinity;palette.forEach((p,i)=>{const q=rgb(p),d=(c[0]-q[0])**2+(c[1]-q[1])**2+(c[2]-q[2])**2;if(d<dist){dist=d;best=i;}});return best;}
document.getElementById('save').addEventListener('click',async()=>{const v=Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value]));localStorage.setItem('citylife-avatar',JSON.stringify(v));
let look=[1,0,1,1,0,0];try{const prior=JSON.parse(localStorage.getItem('look')||'null');if(Array.isArray(prior)&&prior.length>=6)look=prior.slice(0,6).map(n=>n|0);}catch(e){}
look[0]=nearest(v.skin,['#f1c27d','#c68642','#8d5524','#e0ac69','#5c3a21']);
look[1]=v.style==='afro'?1:0;
look[2]=nearest(v.shirt,['#e53935','#1e88e5','#43a047','#fdd835','#ffffff','#8e24aa','#ff7043','#212121']);
look[3]=nearest(v.pants,['#1a237e','#212121','#5d4037','#455a64','#827717']);
look[5]=nearest(v.hair,['#0d0b0a','#2b1a10','#5a3a22','#c9a24a','#9b2d20','#9a9a9a']);
localStorage.setItem('look',JSON.stringify(look));
const status=document.getElementById('status'),token=localStorage.getItem('ll_tok');
if(!token){status.textContent='Saved on this device. Sign in to sync this character to your account.';return;}
status.textContent='Saving character to your account…';
try{const response=await fetch('/api/account',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'save-avatar',look,appearance:{skin:v.skin,hair:v.hair,style:v.style,shirt:v.shirt,pants:v.pants,shoes:v.shoes}})});
const result=await response.json();if(!response.ok)throw new Error(result.error||'Account save failed');
status.textContent='Character saved to your account ✓ It will load when you join the city.';
}catch(error){status.textContent='Saved on this device, but account sync failed: '+error.message;}
});
try{const saved=JSON.parse(localStorage.getItem('citylife-avatar')||'null');if(saved)ids.forEach(id=>{if(saved[id])document.getElementById(id).value=saved[id];});}catch(e){}initAvatar3D();apply();
</script></body></html>
