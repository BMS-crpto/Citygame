name: Request Unity Personal license file

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-activation-file:
    name: Generate Unity manual activation request (.alf)
    runs-on: ubuntu-latest
    steps:
      - name: Generate Unity activation request file
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.0.32f1
          projectPath: unity

      - name: Upload activation request file
        uses: actions/upload-artifact@v4
        with:
          name: Citygame-Unity-Activation-Request
          path: Unity_v*.alf
          if-no-files-found: error
          retention-days: 7
